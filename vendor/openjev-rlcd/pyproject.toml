[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev-rlcd"
version = "0.1.0"
description = "OpenJev-RLCD: a working RLCD (reinforcement learning for calibrated decisions) implementation for reasoning models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0",
    "datasets>=4.0",
    "numpy",
]

[project.optional-dependencies]
analysis = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["openjev_rlcd*"]
